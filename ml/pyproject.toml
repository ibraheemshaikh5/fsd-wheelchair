[project]
name = "fsd-ml"
version = "0.1.0"
description = "FSD wheelchair model side: the viewer that drives the chair, the driving model, and the Claude pilot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
    "httpx>=0.27",
    "websockets>=13",
    # The Claude pilot (fsd_ml/pilot.py).
    "anthropic>=0.70",
]

[dependency-groups]
# The optional obstacle sense (fsd_ml/obstacles.py): a depth model run on this machine.
detect = [
    "torch>=2.4",
    "transformers>=4.45",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Not installed as a package, for the same reason as service/: the code is
# imported straight from this directory.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
