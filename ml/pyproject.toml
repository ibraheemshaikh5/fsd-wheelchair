[project]
name = "fsd-ml"
version = "0.1.0"
description = "FSD wheelchair model side: driving pipeline, simulator, model interface, bake-off."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
    "httpx>=0.27",
    "websockets>=13",
]

[dependency-groups]
detect = [
    "anthropic>=0.70",
    "clip",
    "torch>=2.4",
    "transformers>=4.45",
    "ultralytics>=8.4.213",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Not installed as a package, for the same reason as service/: the code is
# imported straight from this directory.
[tool.uv]
package = false

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
