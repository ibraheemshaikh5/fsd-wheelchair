[project]
name = "fsd-ml"
version = "0.1.0"
description = "FSD wheelchair model side: driving pipeline, simulator, models, bake-off."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Downloading checkpoints. Each model's own runtime (ONNX Runtime, PyTorch) is
# added with the model's driver, not here.
weights = [
    "huggingface-hub>=0.25",
]
# Runs the model-zoo checkpoints (S2E and the rest) on CPU.
onnx = [
    "onnxruntime>=1.20",
]

# Not installed as a package, for the same reason as service/: the code is
# imported straight from this directory.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
