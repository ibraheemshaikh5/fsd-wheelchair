[project]
name = "drive-service"
version = "0.1.0"
description = "FSD wheelchair driving service. First piece: phone sensor ingest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pygeomag>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "pillow>=10",
    "ruff>=0.6",
]

# Not installed as a package: macOS hides files under .venv in iCloud-synced
# folders and Python skips hidden .pth files, which breaks editable installs.
# The code is imported straight from this directory instead.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--cov=drive_service --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["drive_service/__main__.py"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
