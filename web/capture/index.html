<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chair Camera</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body>
    <main>
      <h1>Chair camera</h1>
      <p id="insecure" class="error"></p>

      <div class="actions">
        <button id="start" class="primary" type="button">Start streaming</button>
        <button id="stop" class="danger" type="button" disabled>Stop</button>
      </div>
      <p id="error" class="error" role="alert"></p>

      <section class="panel">
        <dl class="rows" id="status" aria-live="polite"></dl>
      </section>

      <h2>Preview</h2>
      <video id="preview" playsinline muted autoplay></video>
      <canvas id="encoder" hidden></canvas>

      <h2>Mount and stream settings</h2>
      <form id="settings" class="panel fields">
        <label class="field">Lens height (m)<input name="mountHeightM" type="number" step="0.05" inputmode="decimal" /></label>
        <label class="field">Tilt (°, down is negative)<input name="mountPitchDeg" type="number" step="1" inputmode="decimal" /></label>
        <label class="field">Max frames per second<input name="fps" type="number" step="1" inputmode="numeric" /></label>
        <label class="field">Max image side (px)<input name="maxWidth" type="number" step="16" inputmode="numeric" /></label>
        <label class="field">JPEG quality (0.3–0.95)<input name="jpegQuality" type="number" step="0.05" inputmode="decimal" /></label>
        <label class="field">Rotate picture
          <select name="rotateDeg">
            <option value="-1">Automatic</option>
            <option value="0">Never</option>
            <option value="90">90° clockwise</option>
            <option value="180">180°</option>
            <option value="270">90° counter-clockwise</option>
          </select>
        </label>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
